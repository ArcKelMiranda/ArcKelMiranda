name: Snake de contribuciones

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#FFFFFF&color_dots=#161616,#3a3a3a,#6b6b6b,#BDBDBD,#FFFFFF&color_dot_border=#000000
            dist/snake-light.svg?color_snake=#000000&color_dots=#F2F2F2,#BDBDBD,#8a8a8a,#4a4a4a,#000000&color_dot_border=#FFFFFF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
