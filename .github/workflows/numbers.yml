name: Actualizar los números

on:
  schedule:
    - cron: "0 6 * * *"   # todos los días, 00:00 hora de El Salvador
  workflow_dispatch:

permissions:
  contents: write

jobs:
  numbers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools==4.62.1

      - name: Generar assets/numbers.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_LOGIN: ${{ github.repository_owner }}
        run: python .github/scripts/build_numbers.py

      - name: Commit si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/numbers.svg
          git diff --cached --quiet || git commit -m "chore: actualizar números [skip ci]"
          git push
